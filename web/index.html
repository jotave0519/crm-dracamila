<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Le o tema salvo ANTES do primeiro paint, pra splash/app nunca piscarem
         no tema errado (mesma chave que ThemeContext.tsx usa). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("dracamila-crm-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta name="theme-color" content="#5c8a6b" />

    <!-- iOS: o manifest sozinho nao basta pra "Adicionar a Tela de Inicio" se comportar como app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Fisioterapia" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>CRM — Clínica de Fisioterapia</title>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f6f7f3;
        transition: opacity 0.22s ease;
      }
      html[data-theme="dark"] #app-splash {
        background: #171a16;
      }
      #app-splash .splash-mark {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, #5c8a6b, #3f6249);
        box-shadow: 0 10px 28px rgba(63, 98, 73, 0.3);
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 600;
        font-size: 28px;
        color: #f2f7f3;
        line-height: 1;
      }
      #app-splash .splash-title {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 600;
        font-size: 20px;
        color: #1f2420;
        letter-spacing: -0.015em;
      }
      html[data-theme="dark"] #app-splash .splash-title {
        color: #eef1ea;
      }
      #app-splash .splash-sub {
        font-family: "Instrument Sans", system-ui, -apple-system, sans-serif;
        font-size: 12.5px;
        color: #7c8579;
        letter-spacing: 0.02em;
        margin-top: -8px;
      }
      #app-splash .splash-spinner {
        width: 22px;
        height: 22px;
        margin-top: 6px;
        border: 2.5px solid rgba(92, 138, 107, 0.25);
        border-top-color: #5c8a6b;
        border-radius: 50%;
        animation: splash-spin 0.7s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="splash-mark">F</div>
      <div class="splash-title">Clínica de Fisioterapia</div>
      <div class="splash-sub">Sistema de Gestão</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
